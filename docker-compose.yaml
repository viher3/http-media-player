services:
  media-player:
    build: .
    image: http-media-player
    container_name: http-media-player
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      WATCH_POLLING: ${WATCH_POLLING:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      # Host folder with your media, mounted read-only
      - ${MEDIA_PATH:-./media}:/media:ro
      # Persistent index (SQLite)
      - media-player-data:/data

volumes:
  media-player-data:
